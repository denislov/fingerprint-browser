[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The package is `app` because it is the application crate; the program is named
# for what it does, because this is the name that ends up in `--version`, in the
# window's title bar and in an installed shortcut.
[[bin]]
name = "fingerprint-browser"
path = "src/main.rs"

[dependencies]
domain = { workspace = true }
storage = { workspace = true }
runtime = { workspace = true }
application = { workspace = true }
gpui-kit = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The tray icon on Linux: a StatusNotifierItem over D-Bus. `blocking` is the API
# that does not need an async runtime to spawn the service, and `async-io` is the
# reactor underneath it. Deliberately built without its default features, which
# pull in an async runtime this program does not have; what is left is pure Rust
# through zbus, so no GTK and no libdbus enter the build or the packages.
#
# `x11rb` is the other half of this program's X11 story: adopting the XCB
# connection GPUI already owns, so the window can be unmapped and mapped - GPUI
# exposes no hide of its own. The same crate and version GPUI links, so this is a
# feature unification rather than a second copy of anything, and
# `allow-unsafe-code` is what makes `xcb_ffi` - and the `-lxcb` that CI and the
# packages already install - available.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = [
    "blocking",
    "async-io",
] }
x11rb = { version = "0.13", default-features = false, features = [
    "allow-unsafe-code",
] }

# The Windows half of the data-directory lock is `LockFileEx`, which is declared
# under the file-system feature; the other two are what the call and its error
# code need. The same crate and version the runtime already uses for its job
# objects, so a Windows build resolves one copy.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
] }

# The tray icon on Windows: the shell's notification area. Target-gated because
# the same crate's Linux half links GTK and libappindicator, neither of which this
# program uses - the Linux tray is `ksni`, above.
tray-icon = "0.25"

# The window's own handles, which is how "keep running" takes the window off the
# screen: the Win32 `HWND` that `ShowWindowAsync` wants, and the X11 window id
# that `UnmapWindow` goes through. GPUI implements `raw-window-handle` for
# `Window` on both platforms even though it exposes no hide of its own - see
# `window_visibility.rs`.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
raw-window-handle = "0.6"

# Only for a Windows host, because it is only used by `build.rs` there: it puts
# the icon and the version into the executable's resource section, which is what
# Explorer, the taskbar and the installer's properties page read. A Linux build
# neither downloads it nor needs it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
