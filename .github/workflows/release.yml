name: Release

# A release starts from a tag, because the tag is the one thing that has to agree
# with the version in Cargo.toml - and a build whose tag and manifest disagree
# cannot be reproduced from either. The manual trigger runs the same packaging
# jobs without publishing, which is how the Windows path gets exercised without
# cutting a release for it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # One reader for the version, and one place the rules about it are applied, so
  # neither packaging job can disagree with the other about what is being built.
  manifest:
    name: the version, the tag and the changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: read
        name: Read the version and compare it with the tag
        run: |
          version="$(./scripts/version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml says $version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the manifest version $version"
              exit 1
            fi
          fi

      - name: The changelog says something about this version
        run: |
          version="$(./scripts/version.sh)"
          if ./scripts/changelog-section.sh "$version" > /dev/null 2>&1; then
            echo "CHANGELOG.md has a section for $version"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section, and the release notes come from it"
            exit 1
          else
            echo "::warning::CHANGELOG.md has no '## [$version]' section yet, which a tag would refuse"
          fi

  linux:
    name: the Linux artifacts
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The same list the gate installs, and it has to be the list the *release*
      # binary needs: `ldd` on the archive's binary names libxcb, libxkbcommon and
      # libxkbcommon-x11 among its dependencies, so a job that installed only the
      # font stack would fail to link before it ever got to packaging.
      - name: Install the system libraries the workspace links against
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1-dev libfreetype-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      # The version `rust-toolchain.toml` pins; see the note there. Both jobs
      # here build artifacts people keep, so the compiler is the one thing
      # that should not be decided by the calendar.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2

      - name: Build and package
        run: ./packaging/linux/package.sh

      # The archive and its checksum, unpacked and installed for real: this is
      # the job that would catch a packaging script that only works on the
      # machine it was written on.
      - name: Unpack it and install it into a fake home
        run: |
          set -eu
          scratch="$(mktemp -d)"
          tar xzf dist/fingerprint-browser-*-linux-*.tar.gz -C "$scratch"
          unpacked="$(find "$scratch" -maxdepth 1 -type d -name 'fingerprint-browser-*')"
          ( cd "$unpacked" && HOME="$scratch/home" PREFIX="$scratch/home/.local" ./install.sh )
          "$scratch/home/.local/bin/fingerprint-browser" --version
          test -f "$scratch/home/.local/share/applications/fingerprint-browser.desktop"
          ( cd dist && sha256sum -c ./*.sha256 )

      # The package, installed the way a user installs it. `dpkg --install` does
      # not fetch anything and checks the dependencies against what is already
      # here, so the two checks that matter are separate: every package the
      # control file names exists in the distribution, and dpkg accepts the
      # package itself - its control file, its maintainer scripts and the places
      # it puts its files. The release of it afterwards is the last check: a
      # package that cannot be removed is a package that should not be published.
      - name: Install the package and run what it installed
        run: |
          set -eu
          deb="$(ls dist/*.deb)"
          dpkg-deb --info "$deb"
          # One dependency per word, with any version constraint dropped: the
          # question here is whether the distribution carries the package, not
          # which versions of it would do.
          for dependency in $(dpkg-deb -f "$deb" Depends | tr ',' '\n' | sed 's/(.*//'); do
            dpkg -s "$dependency" > /dev/null
            echo "in this distribution: $dependency"
          done
          sudo dpkg --install "$deb"
          /usr/bin/fingerprint-browser --version
          test -f /usr/share/applications/fingerprint-browser.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/fingerprint-browser.png
          test -f /usr/share/doc/fingerprint-browser/copyright
          sudo dpkg --remove fingerprint-browser
          test ! -e /usr/bin/fingerprint-browser

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz*
            dist/*.deb*
          if-no-files-found: error

  windows:
    name: the Windows installer
    needs: manifest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2

      # The image usually has Inno Setup; installing it is idempotent, and the
      # script fails with the command to run if it is still not there.
      - name: Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build and package
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Version ${{ needs.manifest.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*setup.exe*
          if-no-files-found: error

  # Only a tag publishes. The artifacts are attached as they are - the checksum
  # file beside each - so what was verified in the job above is what is
  # downloadable.
  publish:
    name: attach the artifacts to the release
    # `github.ref` rather than `github.ref_type`: the ref is the value every
    # version of the runner has had, and the prefix says the same thing.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [manifest, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from the changelog section for this version
        run: ./scripts/changelog-section.sh "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Fingerprint Browser ${{ needs.manifest.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
